<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="ছবি থেকে পিডিএফ ও সিভি তৈরির illustrations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset=".55" stop-color="#151515"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".32" r=".7">
      <stop offset="0" stop-color="#f97316" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ea580c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset=".5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1e6"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#glow)"/>
  <rect width="1600" height="760" fill="url(#dots)"/>

  <!-- ambient rings -->
  <g fill="none" stroke="#f97316" opacity=".22">
    <circle cx="1210" cy="330" r="330" stroke-width="1.5"/>
    <circle cx="1210" cy="330" r="410" stroke-width="1"/>
    <circle cx="1210" cy="330" r="250" stroke-width="1" stroke-dasharray="3 14"/>
  </g>
  <circle cx="1370" cy="150" r="90" fill="#f97316" opacity=".25" filter="url(#soft)"/>

  <!-- orange tile behind the documents -->
  <g transform="rotate(-8 1180 380)" filter="url(#shadow)">
    <rect x="900" y="185" width="500" height="390" rx="44" fill="url(#orange)" opacity=".95"/>
    <rect x="900" y="185" width="500" height="390" rx="44" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
  </g>

  <!-- photo stack -->
  <g transform="rotate(7 1050 470)" filter="url(#shadow)">
    <rect x="880" y="320" width="260" height="230" rx="18" fill="#fff7ed"/>
    <rect x="898" y="338" width="224" height="140" rx="10" fill="#0a0a0a"/>
    <circle cx="962" cy="384" r="22" fill="#f97316"/>
    <path d="M898 460l62-58 44 38 36-28 82 66v12H898z" fill="#ea580c" opacity=".9"/>
    <rect x="898" y="496" width="140" height="10" rx="5" fill="#fdba74"/>
    <rect x="898" y="516" width="96" height="8" rx="4" fill="#fed7aa"/>
  </g>

  <!-- CV page -->
  <g transform="rotate(-4 1250 350)" filter="url(#shadow)">
    <rect x="1110" y="130" width="330" height="440" rx="20" fill="url(#paper)"/>
    <rect x="1110" y="130" width="330" height="440" rx="20" fill="none" stroke="#f97316" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="1170" cy="192" r="30" fill="#0a0a0a"/>
    <circle cx="1170" cy="184" r="12" fill="#fdba74"/>
    <path d="M1150 212c4-12 14-18 20-18s16 6 20 18" fill="#f97316"/>
    <rect x="1216" y="172" width="150" height="14" rx="7" fill="#0a0a0a"/>
    <rect x="1216" y="196" width="108" height="9" rx="4.5" fill="#fdba74"/>
    <rect x="1140" y="250" width="80" height="10" rx="5" fill="#f97316"/>
    <rect x="1140" y="274" width="270" height="7" rx="3.5" fill="#d6d3d1"/>
    <rect x="1140" y="290" width="250" height="7" rx="3.5" fill="#e7e5e4"/>
    <rect x="1140" y="306" width="262" height="7" rx="3.5" fill="#e7e5e4"/>
    <rect x="1140" y="340" width="70" height="10" rx="5" fill="#f97316"/>
    <rect x="1140" y="364" width="270" height="7" rx="3.5" fill="#d6d3d1"/>
    <rect x="1140" y="380" width="228" height="7" rx="3.5" fill="#e7e5e4"/>
    <rect x="1140" y="396" width="256" height="7" rx="3.5" fill="#e7e5e4"/>
    <rect x="1140" y="430" width="84" height="10" rx="5" fill="#f97316"/>
    <rect x="1140" y="454" width="250" height="7" rx="3.5" fill="#d6d3d1"/>
    <rect x="1140" y="470" width="232" height="7" rx="3.5" fill="#e7e5e4"/>
    <rect x="1140" y="500" width="130" height="24" rx="12" fill="#0a0a0a"/>
    <rect x="1280" y="500" width="80" height="24" rx="12" fill="#fed7aa"/>
  </g>

  <!-- PDF badge -->
  <g transform="rotate(-10 970 250)" filter="url(#shadow)">
    <rect x="870" y="160" width="150" height="64" rx="16" fill="#0a0a0a"/>
    <rect x="870" y="160" width="150" height="64" rx="16" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M902 176h20l10 10v24h-30z" fill="#f97316"/>
    <path d="M922 176v10h10" fill="#fdba74"/>
    <text x="944" y="199" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">PDF</text>
  </g>

  <!-- floating dots / plus marks -->
  <g fill="#f97316">
    <circle cx="840" cy="120" r="7"/>
    <circle cx="1480" cy="250" r="5" opacity=".7"/>
    <circle cx="800" cy="620" r="4" opacity=".6"/>
    <path d="M1450 560h22v6h-22zM1458 552h6v22h-6z" opacity=".8"/>
    <path d="M820 300h18v5h-18zM826 294h5v18h-5z" opacity=".5"/>
  </g>

  <!-- soft bottom fade -->
  <rect y="640" width="1600" height="120" fill="#0a0a0a" opacity=".55"/>
</svg>
